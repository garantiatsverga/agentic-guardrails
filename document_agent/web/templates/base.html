<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Document Agent{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            background: #f6f8fa;
            color: #1f2328;
            line-height: 1.5;
        }
        header { border-bottom: 2px solid #d0d7de; padding-bottom: 12px; margin-bottom: 24px; }
        header h1 { margin: 0 0 4px; font-size: 22px; }
        header .subtitle { color: #656d76; font-size: 13px; }
        header nav { margin-top: 12px; font-size: 13px; }
        header nav a { color: #0969da; text-decoration: none; margin-right: 16px; }
        header nav a:hover { text-decoration: underline; }
        .card {
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 { margin: 0 0 12px; font-size: 16px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input[type=file], textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea { min-height: 80px; resize: vertical; }
        button {
            background: #1f883d;
            color: #fff;
            border: 0;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1a7f37; }
        button.secondary { background: #656d76; }
        button.secondary:hover { background: #57606a; }
        .error {
            background: #ffebe9;
            border: 1px solid #ff818266;
            color: #82071e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .hint { color: #656d76; font-size: 12px; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eaeef2; }
        th { background: #f6f8fa; font-weight: 600; font-size: 13px; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.passed { background: #dafbe1; color: #1a7f37; }
        .badge.warning { background: #fff8c5; color: #9a6700; }
        .badge.error { background: #ffebe9; color: #cf222e; }
        .status-success { color: #1a7f37; font-weight: 600; }
        .status-partial { color: #9a6700; font-weight: 600; }
        .status-failed { color: #cf222e; font-weight: 600; }
        .kv { display: grid; grid-template-columns: 240px 1fr; gap: 6px 16px; font-size: 14px; }
        .kv .k { color: #656d76; }
        code { background: #eff1f3; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
        .muted { color: #656d76; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <h1>Document Agent</h1>
        <div class="subtitle">Спринт 1 — обработка документов (прототип)</div>
        <nav>
            <a href="/">← Новая заявка</a>
            <a href="/audit">Аудит</a>
            <a href="/health">Health</a>
        </nav>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
