[package]                          # ← корень теперь тоже пакет
name = "agentic_guardrails_core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "_core"                     # ← имя Python-модуля
crate-type = ["cdylib"]            # ← только cdylib, rlib не нужен
path = "src/lib.rs"                # ← фасад

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
cost_cb = { path = "crates/cost_cb" }   # ← линкуем crate

[workspace]                        # ← workspace остаётся
members = ["crates/cost_cb"]
resolver = "2"
